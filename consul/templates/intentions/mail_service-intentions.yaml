apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: mail-intentions
  namespace: app
spec:
  destination:
    name: mail-service
  sources:
    - name: frontend
      action: allow
    - name: password-protection
      action: allow
    - name: auth
      action: allow
    - name: "*"
      action: deny
